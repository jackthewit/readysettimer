<section id="stage" class="stage" aria-label="3D 운동 공간">
  <div id="view"></div>
  <div id="tags" class="tags"></div>
  <div id="hoverTag" class="hover-tag" hidden><b></b><small></small></div>

  <div id="gymUi">
    <header class="top">
      <div class="top-left">
        <span class="gym-mark">ONLINE GYM</span>
        <span id="shopName" class="shop-title"></span>
      </div>
      <p id="memberCount" class="together" aria-live="polite">지금은 혼자 운동 중</p>
      <div class="top-right">
        <button id="menuBtn" class="ctl" type="button" aria-pressed="false">메뉴</button>
        <button id="openChat" class="ctl" type="button" aria-pressed="false" aria-label="채팅 열기">채팅<span id="chatBadge" class="badge" hidden></span></button>
        <button id="openPt" class="ctl" type="button" aria-pressed="false" aria-label="부리부리 쌤 PT 열기">PT</button>
      </div>
    </header>

    <div id="menu" class="menu" hidden>
      <p class="menu-title">운동하는 삶</p>
      <form id="nickForm" class="menu-sec">
        <label for="nickInput">닉네임</label>
        <div class="nick-row">
          <input id="nickInput" maxlength="12" autocomplete="off" />
          <button id="nickSave" class="ctl" type="submit">바꾸기</button>
        </div>
      </form>
      <div class="menu-sec">
        <span>옷 색</span>
        <div id="colorPickerGym" class="shirt-studio"></div>
      </div>
      <div class="menu-sec">
        <span>샵 이동</span>
        <div class="shops">
          <button type="button" class="shop" data-go="weight" id="go-weight"><b>웨이트샵</b><small data-live="weight"></small></button>
          <button type="button" class="shop" data-go="pilates" id="go-pilates"><b>필라테스샵</b><small data-live="pilates"></small></button>
        </div>
      </div>
      <div class="menu-sec">
        <span>오늘 기록</span>
        <p id="logLine" class="log-line"></p>
      </div>
      <div id="channelSec" class="menu-sec" hidden>
        <span>방</span>
        <div class="nick-row"><p id="channelText" class="log-line"></p><button id="channelNext" class="ctl" type="button">다른 방</button></div>
      </div>
      <div id="shareSec" class="menu-sec" hidden>
        <span>나누기</span>
        <div class="sound-row"><button id="photoBtn" class="ctl" type="button">사진 찍기</button><button id="linkBtn" class="ctl" type="button">링크 복사</button></div>
      </div>
      <button id="menuPt" class="ctl menu-pt" type="button">온라인짐 후원</button>
      <div class="menu-sec">
        <span>소리</span>
        <input id="volume" class="volume" type="range" min="0" max="100" aria-label="소리 크기" />
        <div class="sound-row">
          <button id="musicBtn" class="ctl" type="button" aria-pressed="true">음악</button>
          <button id="ambientBtn" class="ctl" type="button" aria-pressed="true">짐 소리</button>
          <button id="soundBtn" class="ctl" type="button" aria-pressed="true">전체 소리</button>
        </div>
      </div>
    </div>

    <div class="gestures" role="group" aria-label="몸짓으로 인사하기">
      <button type="button" id="gest-wave" data-gesture="wave">인사</button>
      <button type="button" id="gest-clap" data-gesture="clap">박수</button>
      <button type="button" id="gest-thumbs" data-gesture="thumbs">엄지척</button>
      <button type="button" id="gest-hooray" data-gesture="hooray">만세</button>
      <button type="button" id="gest-rest" data-gesture="rest" aria-pressed="false">앉기</button>
    </div>

    <div id="routine" class="routine" aria-label="오늘의 루틴">
      <b id="todayReps">오늘 0회</b>
      <span data-r="cardio">유산소</span><span data-r="strength">근력</span><span data-r="stretch">스트레칭</span>
    </div>

    <div id="classBar" class="class-bar" hidden>
      <span id="classText"></span>
      <button id="classBtn" class="ctl" type="button" hidden>같이 하기</button>
    </div>

    <div class="dock">
      <div class="dock-status" aria-live="polite">
        <span id="exName">비어 있는 기구를 눌러 보세요</span>
        <b id="clock" class="clock" hidden>—</b>
      </div>
      <div class="dock-actions">
        <button id="repBtn" class="rep-btn" type="button" hidden>하나</button>
        <button id="ptChanceBtn" class="ctl" type="button" hidden>PT 쌤 부르기</button>
        <button id="releaseBtn" class="ctl" type="button" hidden>기구 반납</button>
        <button id="leaveQueueBtn" class="ctl" type="button" hidden>줄에서 나오기</button>
      </div>
      <nav id="stnbar" class="stnbar" aria-label="기구 고르기"></nav>
    </div>

    <button id="joinBtn" class="join-btn" type="button">온라인짐 후원</button>

    <section id="chatFloat" class="chat-float" aria-label="채팅">
      <ol id="chatLog" class="log"></ol>
      <form id="chatForm" class="composer">
        <div id="chatLock" class="lock">
          <span id="chatLockTitle">쉬는 시간에만 채팅할 수 있어요</span>
          <small id="chatLockSub">세트를 끝내면 열려요</small>
        </div>
        <input id="chatInput" maxlength="140" placeholder="메시지를 입력하세요" aria-label="채팅 입력" />
        <button type="submit" id="chatSend">보내기</button>
      </form>
    </section>

    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <b>부리부리 쌤 PT</b>
        <button id="closePanel" class="panel-close" type="button" aria-label="닫기">닫기</button>
      </div>

      <div id="ptPane" class="pane">
        <div class="pt-intro">
          <img src="buri.png" alt="" />
          <p>기구와 자세에 대해 물어보세요. 지금 쓰는 기구에 맞춰 알려 줘요.<br /><small id="ptQuota"></small></p>
        </div>
        <ol id="ptLog" class="log pt-log"></ol>
        <div class="chips" id="ptChips">
          <button type="button">이 기구 자세 좀 봐 주세요</button>
          <button type="button">이 운동은 어디에 좋아요?</button>
          <button type="button">허리가 뻐근한데 해도 될까요?</button>
          <button type="button">더 쉽게 하는 방법 있어요?</button>
        </div>
        <form id="ptForm" class="composer">
          <input id="ptInput" maxlength="300" placeholder="궁금한 걸 물어보세요" aria-label="PT 질문 입력" />
          <button type="submit" id="ptSend">질문</button>
        </form>
      </div>
    </aside>
  </div>
</section>

<div id="payModal" class="pay-modal" hidden>
  <div class="pay-box" role="dialog" aria-modal="true" aria-labelledby="payTitle">
    <h2 id="payTitle">온라인짐 후원</h2>
    <p>이 짐은 누구나 무료로 쓸 수 있어요. 후원은 서버를 유지하는 데 쓰여요.</p>
    <div id="payPlans" class="plans"></div>
    <p id="payMsg" class="pay-msg" role="status" hidden></p>
    <div class="pay-actions">
      <button id="payClose" class="ctl plain" type="button">닫기</button>
      <button id="payGo" class="ctl pay-go" type="button">후원하기</button>
    </div>
  </div>
</div>

<div id="loading" class="loading">
  <h1>ONLINE GYM</h1>
  <p>운동하는 삶</p>
  <small id="loadNote">불러오는 중이에요</small>
</div>

<div id="toast" class="toast" role="status" hidden></div>
